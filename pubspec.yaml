name: trading_app
description: A Flutter trading app with AI integration, MT5 MCP, Linux CLI terminal, native charts, portfolio, and push notifications.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.68.0
  webview_flutter: ^4.7.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  http: ^1.2.1
  web_socket_channel: ^2.4.0
  flutter_local_notifications: ^17.2.2
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
